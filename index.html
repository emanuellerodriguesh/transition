<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartas Misteriosas</title>
    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <div class="container">

        <h1>🔮 Cartas Misteriosas</h1>
        <p>Passe o mouse sobre uma carta para descobrir o segredo!</p>

        <div class="cartas">

            <!-- Carta 1 -->
            <div class="carta">
                <div class="carta-interna">

                    <div class="frente">
                        <span>❓</span>
                        <h2>Segredo</h2>
                    </div>

                    <div class="verso">
                        <span>🐱</span>
                        <h2>Gato!</h2>
                        <p>Você encontrou um gatinho.</p>
                    </div>

                </div>
            </div>

            <!-- Carta 2 -->
            <div class="carta">
                <div class="carta-interna">

                    <div class="frente">
                        <span>❓</span>
                        <h2>Segredo</h2>
                    </div>

                    <div class="verso">
                        <span>🍕</span>
                        <h2>Pizza!</h2>
                        <p>Você ganhou uma pizza.</p>
                    </div>

                </div>
            </div>

            <!-- Carta 3 -->
            <div class="carta">
                <div class="carta-interna">

                    <div class="frente">
                        <span>❓</span>
                        <h2>Segredo</h2>
                    </div>

                    <div class="verso">
                        <span>💰</span>
                        <h2>Dinheiro!</h2>
                        <p>Você ficou milionário!</p>
                    </div>

                </div>
            </div>

        </div>

    </div>

</body>
</html>
